# 1) cd frontend && flutter build web --release --dart-define=API_BASE=http://localhost:8080
# 2) copy .env.example to .env, then: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: fintrack, POSTGRES_USER: fintrack, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DEBUG: "0"
      HTTPS: "0"           # set to 1 behind real HTTPS
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080}"
      CSRF_TRUSTED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080}"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: fintrack
      DB_USER: fintrack
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on: [db]
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro   # run `flutter build web` first
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
