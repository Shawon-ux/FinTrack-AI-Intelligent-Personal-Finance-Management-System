server {
  listen 80;
  # static web client
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  # API + Django admin proxied to the backend container
  location ~ ^/(api|admin|static|healthz)/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
}
